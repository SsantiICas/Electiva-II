<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Api buscar/random pokes</title>
  <link rel="stylesheet" href="static/style.css">
 
</head>
<body>
  <h1>Bienvenido a su Investigador de Pokemons :D </h1>

  <input type="text" id="searchInput" placeholder="Nombre o ID del Pokémon">
  <button onclick="searchPokemon()">Buscar</button>
  <button onclick="getRandomPokemon()">Aleatorio</button>

  <div class="pokemon-card" id="pokemonCard">
    <img id="pokemonImage" src="" alt="Pokémon">
    <h2 id="pokemonName"></h2>
    <div id="pokemonTypes"></div>
    <p><strong>Altura:</strong> <span id="pokemonHeight"></span></p>
    <p><strong>Peso:</strong> <span id="pokemonWeight"></span></p>
    <p><strong>Habilidades:</strong></p>
    <ul id="pokemonAbilities"></ul>
    <p><strong>Estadísticas base:</strong></p>
    <div id="pokemonStats"></div>
  </div>
  <script src="static/script.js"></script>
</body>
</html>
